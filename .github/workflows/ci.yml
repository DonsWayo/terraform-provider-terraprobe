name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # Acceptance tests (TestAcc*) only run with TF_ACC set, so this
        # exercises the unit suite, including the Docker-backed database test.
        run: go test ./... -race -coverprofile=coverage.out

      - name: Coverage
        run: go tool cover -func=coverage.out
